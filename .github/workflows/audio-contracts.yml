name: Audio contracts and native components
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    name: Audio contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxfixes-dev libxcb1-dev libpipewire-0.3-dev
      - name: Audio engine and policy tests
        run: cargo test -p rshare-audio --locked
      - name: Authenticated media tests
        run: cargo test -p rshare-net media_transport --locked
      - name: Encrypted PCM pipeline tests
        run: cargo test -p rshare-net --test media_pipeline --locked
      - name: macOS universal HAL plug-in and memory broker
        if: runner.os == 'macOS'
        run: sh scripts/driver/build-macos-audio.sh
      - name: macOS plug-in vtable with sanitizers (not system HAL acceptance)
        if: runner.os == 'macOS'
        run: sh scripts/driver/test-macos-audio.sh
      - name: Linux PipeWire bridge build (not live audio acceptance)
        if: runner.os == 'Linux'
        run: sh scripts/driver/build-linux-audio.sh
