name: RShareMouse
options:
  bundleIdPrefix: com.rsharemouse
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  RShareMouse:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rsharemouse.ios
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  RShareMouseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: RShareMouse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  RShareMouseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: RShareMouse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RShareMouse:
    build:
      targets:
        RShareMouse: all
    test:
      targets: [RShareMouseTests, RShareMouseUITests]
